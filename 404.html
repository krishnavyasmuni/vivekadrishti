  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vivekadrishti/assets/css/site.css">
  <script>
    (() => {
      const sections = new Map([
        ['/vivekadrishti/introduction-to-hinduism/', '/vivekadrishti/pages/introduction-to-hinduism/'],
        ['/vivekadrishti/indology/', '/vivekadrishti/pages/indology/'],
        ['/vivekadrishti/purana-library/', '/vivekadrishti/pages/purana-library/'],
        ['/vivekadrishti/bhagavatam-with-sridhara-bhasya/', '/vivekadrishti/pages/bhagavatam-with-sridhara-bhasya/'],
        ['/vivekadrishti/bhavishya-purana-brahmaparvan/', '/vivekadrishti/pages/bhavishya-purana-brahmaparvan/']
      ]);

      if (sections.has(location.pathname)) {
        location.replace(sections.get(location.pathname));
        return;
      }

      const match = location.pathname.match(/^\/vivekadrishti\/\d{4}\/\d{2}\/\d{2}\/([^/]+)\/?$/);
      if (!match) return;

      const oldSlug = decodeURIComponent(match[1]);
      const removed = new Set([
        'a-sastric-lens-of-varṇa-part-one-design-draft',
        'design-preview-a-shashtric-lens-of-varna-part-one',
        'test-a-shashtric-lens-of-varna-part-one'
      ]);

      if (removed.has(oldSlug)) {
        location.replace('/vivekadrishti/articles/');
        return;
      }

      const cleanSlug = oldSlug.replaceAll('│', '-');
      location.replace('/vivekadrishti/articles/' + encodeURIComponent(cleanSlug) + '/');
    })();
  </script>
</head>
