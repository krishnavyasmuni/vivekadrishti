  <style>
    .chapter-index{width:100%;font-family:Arial,Helvetica,sans-serif}
    .chapter-index .index-title{margin:0 0 12px;padding:4px 8px;border:1px solid #a8cabb;background:#cfeee2;color:#111;font-size:20px;font-weight:700;line-height:1.2}
    .section-block{margin:0 0 26px}
    .section-heading{margin:0 0 8px;padding:0 0 6px;border-bottom:1px solid #d8d8d8;color:#16539b;font-size:16px;font-weight:400;line-height:1.3}
    .chapter-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 18px;margin:0;padding:0 12px 0 22px}
    .chapter-grid a{display:block;color:#16539b;font-size:14px;line-height:1.25;text-decoration:none;white-space:nowrap}
    .chapter-grid a:hover{text-decoration:underline}
    @media(max-width:900px){.chapter-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
    @media(max-width:650px){.chapter-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;padding-left:12px}.chapter-grid a{font-size:14px}}
    @media(max-width:420px){.chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body class="page-page">
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="/vivekadrishti/">Viveka Dṛṣṭi</a>

  <main class="site-main">
    <article class="article-shell">
      <header class="article-heading"><h1>Bhaviṣya Purāṇa — English</h1><div class="section-rule" aria-hidden="true"></div></header>
      <div class="article-body chapter-index">
        <h2 class="index-title">Bhaviṣya Purāṇa</h2>
        <section class="section-block" aria-labelledby="brahmaparvan-heading">
          <h3 class="section-heading" id="brahmaparvan-heading">Brāhmaparvan</h3>

  <footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer>
  <script src="/vivekadrishti/assets/js/site.js"></script>
  <script>
    (() => {
      const grid = document.querySelector('[data-bhavishya-index]');
      if (!grid) return;
      const combined3944 = '/vivekadrishti/articles/bhavisya-purana-addresses-varna-system/';
      for (let chapter = 1; chapter <= 50; chapter += 1) {
        const link = document.createElement('a');
        if (chapter >= 39 && chapter <= 44) {
          link.href = combined3944;
        } else {
          link.href = `/vivekadrishti/articles/bhavishya-purana-brahmaparvan-chapter-${chapter}/`;
        }
        link.textContent = `Chapter ${chapter}`;
        grid.appendChild(link);
      }
    })();
  </script>
