  <style>
    .bhagavatam-canto-index{max-width:652px;margin:0 auto;color:#3c362e;font-family:Merriweather,Georgia,serif;font-size:20px;font-weight:400;line-height:1.5}
    .bhagavatam-canto-index h2{margin:0 0 30px;padding:0;color:#00787a;font-family:Vollkorn,Georgia,serif;font-size:38px;font-style:normal;font-weight:400;line-height:1.2;text-align:center}

    .chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:6px 16px;margin:12px 0 22px 22px;padding:14px 0 0;border-top:1px solid rgba(60,54,46,.12)}
    .chapter-grid a{display:block;color:#6731fb;font-family:Merriweather,Georgia,serif;font-size:16px;font-weight:400;line-height:1.35;text-decoration:none}
    .chapter-grid a:hover{text-decoration:underline}
    @media(max-width:620px){
      .bhagavatam-canto-index{font-size:18px}
      .bhagavatam-canto-index h2{font-size:34px}
      .canto-group>summary{font-size:19px}
      .chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-left:18px;gap:7px 12px}
      .chapter-grid a{font-size:15px}

  <script>
    (() => {
      const grid = document.querySelector('[data-canto10-index]');
      if (!grid) return;
      const base = '/vivekadrishti/articles/srimad-bhagavatam-tenth-canto-sridhara-svami-rebuild/';
      for (let chapter = 1; chapter <= 90; chapter += 1) {
        const link = document.createElement('a');
        link.href = `${base}#chapter-${chapter}`;
        link.textContent = `Chapter ${chapter}`;
        grid.appendChild(link);

    })();
