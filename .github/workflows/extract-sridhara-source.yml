name: Extract Sridhara source

on:
  pull_request:
    paths:
      - '.github/workflows/extract-sridhara-source.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/sridhara-direct-canto2-canto10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test direct Sanskrit translation endpoint
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          def tr(text):
              params = urllib.parse.urlencode({'client':'gtx','sl':'sa','tl':'en','dt':'t','q':text})
              req = urllib.request.Request('https://translate.googleapis.com/translate_a/single?' + params, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode('utf-8'))
              return ''.join(x[0] for x in data[0] if x and x[0])
          prose = 'भगवन्-मायावि-मोहितस्य नन्दस्याचरितम् आह---उलूखलम् इति'
          words = 'भगवन्-मायावि-मोहितस्य | नन्दस्याचरितम् | आह | उलूखलम् | इति'
          print('TRANSLATION:', tr(prose))
          print('WORD LEVEL:', tr(words))
          PY
      - name: Extract exact Vishvasa Sridhara blocks
        run: python tools/extract_canto10_sridhara.py
      - name: Commit extracted source to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/canto10-sridhara-source
          git diff --cached --quiet && exit 0
          git commit -m 'Add exact Canto 10 Sridhara source blocks'
          git pull --rebase origin audit/sridhara-direct-canto2-canto10
          git push origin HEAD:audit/sridhara-direct-canto2-canto10
