name: Complete Sridhara direct translations

on:
  pull_request:
    paths:
      - '.github/workflows/extract-sridhara-source.yml'

permissions:
  contents: write

jobs:
  complete:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/sridhara-direct-canto2-canto10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Refresh exact Canto 10 Sridhara source blocks
        run: python tools/extract_canto10_sridhara.py
      - name: Build direct English for Cantos 2 and 10
        run: python tools/complete_sridhara_direct.py
      - name: Commit complete direct translation data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/data/canto10-sridhara-source \
            assets/data/canto10-sridhara-word-for-word \
            assets/data/canto2-sridhara-reviewed \
            assets/data/sridhara-direct-translation-cache.json
          if git diff --cached --quiet; then
            echo 'Translation data already complete.'
            exit 0
          fi
          git commit -m 'Complete direct Sridhara translations for Cantos 2 and 10'
          git pull --rebase origin audit/sridhara-direct-canto2-canto10
          git push origin HEAD:audit/sridhara-direct-canto2-canto10
