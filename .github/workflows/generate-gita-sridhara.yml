name: Generate Gita Sridhara English

on:
  push:
    paths:
      - 'scripts/generate-gita-sridhara-data.py'
      - '.github/workflows/generate-gita-sridhara.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sanskrit translation tools
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers==4.49.0 sentencepiece indic-transliteration

      - name: Fetch Bhagavad Gita Sanskrit source
        run: |
          git clone --depth 1 https://github.com/vedicscriptures/bhagavad-gita.git /tmp/bhagavad-gita-source

      - name: Test BG 18.15 and 18.16
        run: |
          python scripts/generate-gita-sridhara-data.py \
            --source /tmp/bhagavad-gita-source \
            --output /tmp/gita-sridhara-test \
            --chapters 18 \
            --verses 15 16
          cat /tmp/gita-sridhara-test/chapter-18.json
