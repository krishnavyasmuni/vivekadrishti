name: Temporary final branch consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-final-branch-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve unique branch tips as archival tags
        run: |
          git tag -f archive/sridhara-canto2-canto10-complete-2026-08-24 0a1c114701b2d936072fad454f329dae7e31a807
          git tag -f archive/purana-rebuild-2026-08-26 651b344cc5ef713a353116137e3dd4e81bf8c39f
          git push origin refs/tags/archive/sridhara-canto2-canto10-complete-2026-08-24 refs/tags/archive/purana-rebuild-2026-08-26
      - name: Delete the two preserved temporary branches
        run: |
          git push origin --delete \
            fix/sridhara-canto2-canto10-complete \
            codex-rebuild-purana-encyclopedia
