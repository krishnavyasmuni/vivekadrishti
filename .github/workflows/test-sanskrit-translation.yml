name: Test Sanskrit translation endpoint

on:
  push:
    branches:
      - audit/sridhara-direct-canto2-canto10
    paths:
      - '.github/workflows/test-sanskrit-translation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Sanskrit to English
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          text = 'भगवन्-मायावि-मोहितस्य नन्दस्याचरितम् आह---उलूखलम् इति'
          params = urllib.parse.urlencode({'client':'gtx','sl':'sa','tl':'en','dt':'t','q':text})
          req = urllib.request.Request('https://translate.googleapis.com/translate_a/single?' + params, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode('utf-8'))
          print('TRANSLATION:', ''.join(x[0] for x in data[0] if x and x[0]))
          PY
