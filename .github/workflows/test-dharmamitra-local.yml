name: Test Local Dharmamitra Sridhara Analysis
on:
  push:
    paths:
      - 'scripts/test-dharmamitra-local.py'
      - '.github/workflows/test-dharmamitra-local.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers<5' sentencepiece
      - name: Analyze test lines
        run: python scripts/test-dharmamitra-local.py
      - name: Commit test output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bhagavad-gita-sridhara-source/dharmamitra-local-test.json
          git commit -m "Test direct Dharmamitra SLM analysis"
          git push
