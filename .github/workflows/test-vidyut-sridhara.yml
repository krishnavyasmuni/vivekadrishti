name: Test Vidyut Sridhara Segmentation

on:
  push:
    paths:
      - 'scripts/test-vidyut-sridhara.py'
      - '.github/workflows/test-vidyut-sridhara.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Vidyut
        run: pip install vidyut indic-transliteration
      - name: Segment 18.15 and 18.16
        run: python scripts/test-vidyut-sridhara.py
      - name: Commit test output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bhagavad-gita-sridhara-source/vidyut-test-18.json
          git commit -m "Test Vidyut on Sridhara 18.15-18.16"
          git push
