name: Temporary safe branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-safe-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only branches already merged or safely superseded
        run: |
          git push origin --delete \
            audit/sridhara-direct-canto2-canto10 \
            cleanup/repo-debloat-2026-08-26 \
            codex-expand-purana-encyclopedia \
            fix/canto2-canto10-sridhara-rebuild \
            fix/sridhara-literal-commentary
