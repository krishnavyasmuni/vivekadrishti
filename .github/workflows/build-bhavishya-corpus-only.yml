name: Build Bhavishya Corpus Only
on:
  push:
    branches:
      - chatgpt-bhavishya-stylo-corpus
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sparse checkout Bhavishya source only
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/jayeshmepani/HinduScriptures.git _bhavishya_source
          cd _bhavishya_source
          git sparse-checkout init --cone
          git sparse-checkout set "DharmicData/Purana/Bhavishya Purana"
          git checkout main
      - name: Install transliteration dependency
        run: python -m pip install --disable-pip-version-check indic-transliteration
      - name: Restore missing source chapters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from indic_transliteration import sanscript
          patches = [
              ('tools/pratisarga2_021_iast.txt', '3.2. Pratisarga Parva/21.json'),
              ('tools/pratisarga4_012_iast.txt', '3.4. Pratisarga Parva/12.json'),
          ]
          root = Path('_bhavishya_source/DharmicData/Purana/Bhavishya Purana')
          for src, rel in patches:
              iast = Path(src).read_text(encoding='utf-8').strip()
              dev = sanscript.transliterate(iast, sanscript.IAST, sanscript.DEVANAGARI)
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps([{'text': dev}], ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Build corpus
        run: python tools/build_bhavishya_corpus.py
      - name: Repack ZIP with only the 585 chapter txt files
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          corpus = Path('Bhavishya_Purana_Stylo_Corpus/corpus')
          files = sorted(corpus.glob('*.txt'))
          if len(files) != 585:
              raise SystemExit(f'Expected 585 txt files, found {len(files)}')
          out = Path('Bhavishya_Purana_585_Chapter_Corpus.zip')
          if out.exists(): out.unlink()
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in files:
                  z.write(p, f'corpus/{p.name}')
          print(f'Created {out} with {len(files)} files')
          PY
      - name: Upload final corpus ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Bhavishya_Purana_585_Chapter_Corpus
          path: Bhavishya_Purana_585_Chapter_Corpus.zip
          if-no-files-found: error
