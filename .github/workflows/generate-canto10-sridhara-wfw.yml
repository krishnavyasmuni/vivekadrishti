name: Generate Canto 10 Sridhara word-for-word

on:
  push:
    branches: [main]
    paths:
      - tools/generate_canto10_sridhara_wfw.py
      - tools/refine_canto10_sridhara_wfw.py
      - .github/workflows/generate-canto10-sridhara-wfw.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canto10-sridhara-wfw
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Sanskrit morphology tools
        run: python -m pip install --disable-pip-version-check sanskrit_parser

      - name: Refine chapters 8 through 90
        run: python tools/refine_canto10_sridhara_wfw.py

      - name: Commit refined chapter files
        shell: bash
        run: |
          if git diff --quiet -- assets/data/canto10-sridhara-word-for-word; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/canto10-sridhara-word-for-word
          git commit -m "Refine complete Canto 10 Sridhara word-for-word data"
          git push
