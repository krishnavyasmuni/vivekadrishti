name: Repository full-history privacy audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-history-privacy-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch and tag
        run: |
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - name: Scan all reachable Git history without printing matched values
        shell: python
        run: |
          import json, re, subprocess
          from collections import Counter

          def run(*args, input_bytes=None):
              return subprocess.run(args, input=input_bytes, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True).stdout

          refs = run('git','for-each-ref','--format=%(refname)','refs/heads','refs/remotes','refs/tags').decode().splitlines()
          revs = run('git','rev-list','--objects','--all').decode('utf-8','replace').splitlines()
          object_paths = {}
          for line in revs:
              if not line.strip():
                  continue
              oid, *rest = line.split(' ',1)
              path = rest[0] if rest else '(no path)'
              object_paths.setdefault(oid, path)

          checks = [
              ('github_pat', re.compile(r'github_pat_[A-Za-z0-9_]{20,}')),
              ('github_token', re.compile(r'\bgh[pousr]_[A-Za-z0-9]{20,}\b')),
              ('aws_access_key', re.compile(r'\bAKIA[0-9A-Z]{16}\b')),
              ('google_api_key', re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b')),
              ('openai_like_key', re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b')),
              ('private_key_pem', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
              ('slack_token', re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}\b')),
              ('stripe_live_key', re.compile(r'\bsk_live_[A-Za-z0-9]{16,}\b')),
              ('local_macos_path', re.compile(r'/Users/[^/\s]+/')),
              ('local_windows_path', re.compile(r'[A-Za-z]:\\Users\\[^\\\s]+\\')),
              ('uk_phone_like', re.compile(r'(?<!\d)(?:\+44\s?\d{4}|0\d{4})[\s-]?\d{3}[\s-]?\d{3}(?!\d)')),
          ]
          email_re = re.compile(r'(?i)\b[A-Z0-9._%+-]+@([A-Z0-9.-]+\.[A-Z]{2,})\b')
          safe_email_domains = {'users.noreply.github.com','github.com'}

          findings=[]
          scanned_blobs=0
          skipped_large=0
          for oid,path in object_paths.items():
              info = run('git','cat-file','-t',oid).decode().strip()
              if info != 'blob':
                  continue
              size = int(run('git','cat-file','-s',oid).decode().strip())
              if size > 8_000_000:
                  skipped_large += 1
                  findings.append({'kind':'large_blob_not_text_scanned','oid':oid[:12],'path':path,'size':size})
                  continue
              data = run('git','cat-file','blob',oid)
              text = data.decode('utf-8','ignore')
              scanned_blobs += 1
              for kind,rx in checks:
                  if rx.search(text):
                      findings.append({'kind':kind,'oid':oid[:12],'path':path})
              domains = sorted({m.group(1).lower() for m in email_re.finditer(text) if m.group(1).lower() not in safe_email_domains})
              for domain in domains:
                  findings.append({'kind':'external_email','oid':oid[:12],'path':path,'domain':domain})

          log = run('git','log','--all','--format=%H%x09%an%x09%ae%x09%cn%x09%ce').decode('utf-8','replace').splitlines()
          metadata=[]
          seen=set()
          for line in log:
              parts=line.split('\t')
              if len(parts) != 5:
                  continue
              sha,an,ae,cn,ce=parts
              for role,name,email in [('author',an,ae),('committer',cn,ce)]:
                  low=email.lower()
                  if not email or low.endswith('@users.noreply.github.com') or low == 'noreply@github.com':
                      continue
                  key=(sha,role,email)
                  if key in seen:
                      continue
                  seen.add(key)
                  domain=email.rsplit('@',1)[-1].lower() if '@' in email else '(invalid)'
                  metadata.append({'commit':sha[:12],'role':role,'name':name,'email_domain':domain})

          counts=Counter(f['kind'] for f in findings)
          report={
              'refs_scanned':len(refs),
              'reachable_object_entries':len(object_paths),
              'text_blobs_scanned':scanned_blobs,
              'large_blobs_skipped':skipped_large,
              'commit_metadata_records':len(log),
              'non_noreply_commit_identities':metadata,
              'finding_counts':dict(sorted(counts.items())),
              'findings':findings,
          }
          with open('repository-history-privacy-audit.json','w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          print('REFS_SCANNED', report['refs_scanned'])
          print('TEXT_BLOBS_SCANNED', report['text_blobs_scanned'])
          print('LARGE_BLOBS_SKIPPED', report['large_blobs_skipped'])
          print('COMMIT_METADATA_RECORDS', report['commit_metadata_records'])
          print('NON_NOREPLY_COMMIT_IDENTITIES', len(metadata))
          print('FINDING_COUNTS', json.dumps(report['finding_counts'], sort_keys=True))
      - uses: actions/upload-artifact@v4
        with:
          name: repository-history-privacy-audit
          path: repository-history-privacy-audit.json
          retention-days: 1
