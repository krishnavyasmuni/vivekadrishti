name: Probe Dharmamitra API Modes
on:
  push:
    paths:
      - 'scripts/test-dharmamitra-api-modes.py'
      - '.github/workflows/test-dharmamitra-api-modes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/test-dharmamitra-api-modes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bhagavad-gita-sridhara-source/dharmamitra-api-modes.json
          git commit -m "Probe Dharmamitra API output modes"
          git push
