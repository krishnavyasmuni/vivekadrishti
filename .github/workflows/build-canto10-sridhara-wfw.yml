name: Build Canto 10 Sridhara word-for-word

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_canto10_sridhara_wfw.py'
      - '.github/workflows/build-canto10-sridhara-wfw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Sanskrit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install indic-transliteration sanskrit-parser

      - name: Build literal gloss data
        run: python scripts/build_canto10_sridhara_wfw.py

      - name: Show audit summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/data/canto10-sridhara-word-for-word/audit.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(data['summary'], indent=2, ensure_ascii=False))
          PY

      - name: Commit generated chapter data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/canto10-sridhara-word-for-word
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate Canto 10 Sridhara word-for-word data"
            git push
          fi
