name: Complete Canto 2 and 10 Sridhara English

on:
  push:
    branches:
      - fix/sridhara-canto2-canto10-complete
    paths:
      - '.github/workflows/complete-sridhara-bulk.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/complete-sridhara-bulk.yml'

permissions:
  contents: write

concurrency:
  group: sridhara-final-completion
  cancel-in-progress: true

jobs:
  complete:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sridhara-canto2-canto10-complete
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Refresh exact Canto 10 Bhavartha-dipika source
        run: python tools/extract_canto10_sridhara.py
      - name: Complete both English layers and validate coverage
        run: python tools/complete_sridhara_bulk_v2.py
      - name: Commit final Canto 2 and 10 data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/data/canto10-sridhara-source \
            assets/data/canto10-sridhara-word-for-word \
            assets/data/canto2-sridhara-reviewed \
            assets/data/sridhara-clause-translation-cache.json \
            assets/data/sridhara-completion-report.json
          if git diff --cached --quiet; then
            echo 'All translation data already complete.'
            exit 0
          fi
          git commit -m 'Complete Sridhara English for Cantos 2 and 10'
          git pull --rebase origin fix/sridhara-canto2-canto10-complete
          git push origin HEAD:fix/sridhara-canto2-canto10-complete
