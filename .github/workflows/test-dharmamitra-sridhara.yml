name: Test Dharmamitra Sridhara Segmentation

on:
  push:
    paths:
      - 'scripts/test-dharmamitra-sridhara.py'
      - '.github/workflows/test-dharmamitra-sridhara.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests indic-transliteration
      - name: Analyze 18.15 and 18.16
        run: python scripts/test-dharmamitra-sridhara.py
      - name: Commit test output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bhagavad-gita-sridhara-source/dharmamitra-test-18.json
          git commit -m "Test Dharmamitra on Sridhara 18.15-18.16"
          git push
