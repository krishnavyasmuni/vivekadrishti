name: Test Sridhara Literal Word Parser

on:
  push:
    paths:
      - 'scripts/test-sridhara-word-parser.py'
      - '.github/workflows/test-sridhara-word-parser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser
        run: pip install sanskrit_parser indic-transliteration
      - name: Parse 18.15 and 18.16
        run: python scripts/test-sridhara-word-parser.py
      - name: Commit parser test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bhagavad-gita-sridhara-source/parser-test-18.json
          git commit -m "Test literal parser on Sridhara 18.15-18.16"
          git push
